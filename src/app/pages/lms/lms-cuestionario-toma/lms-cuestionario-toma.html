<div class="modal-backdrop">
  <div class="modal-content w-full max-w-3xl p-6 bg-white rounded-lg shadow-xl overflow-y-auto max-h-[90vh] relative">
    
    <div class="flex justify-between items-start mb-6 border-b pb-4 sticky top-0 bg-white z-10 pt-2">
      <div>
        <h2 class="text-2xl font-bold text-slate-800">{{ cuestionario?.titulo }}</h2>
        <p class="text-slate-500 text-sm mt-1" *ngIf="cuestionario?.descripcion">{{ cuestionario.descripcion }}</p>
      </div>
      
      <div *ngIf="cuestionario?.limiteTiempoMinutos" class="flex flex-col items-end">
        <span class="text-xs font-bold text-slate-500 uppercase">Tiempo Restante</span>
        <span class="text-2xl font-mono font-bold font-mono" 
              [ngClass]="{'text-green-600': minutosRestantes > 300, 'text-red-600 animate-pulse': minutosRestantes <= 300}">
          ⏱️ {{ tiempoFormateado }}
        </span>
      </div>
      
      <button *ngIf="!cuestionario?.limiteTiempoMinutos" (click)="cancel.emit()" class="text-slate-500 hover:text-slate-700 text-2xl font-bold">&times;</button>
    </div>

    <form *ngIf="form" [formGroup]="form" (ngSubmit)="guardar()" class="space-y-8">
      <div formArrayName="respuestas">
        <div *ngFor="let p of cuestionario?.preguntas; let i=index" [formGroupName]="i" class="border p-5 rounded-lg bg-slate-50 shadow-sm">
          
          <div class="flex justify-between items-start mb-4">
            <h3 class="font-bold text-lg text-slate-800">
              <span class="text-blue-600 mr-2">{{ i + 1 }}.</span> {{ p.enunciado }}
            </h3>
            <span class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded whitespace-nowrap">{{ p.valorPuntos }} pts</span>
          </div>

          <!-- Múltiple -->
          <div *ngIf="p.tipo === 'CERRADA_MULTIPLE'" class="space-y-3 pl-6">
            <label *ngFor="let opt of p.opciones" class="flex items-center gap-3 p-3 bg-white border rounded cursor-pointer hover:bg-blue-50 transition">
              <input type="radio" formControlName="opcionId" [value]="opt.id" class="w-5 h-5 text-blue-600">
              <span class="text-slate-700">{{ opt.texto }}</span>
            </label>
          </div>

          <!-- Abierta -->
          <div *ngIf="p.tipo === 'ABIERTA_TEXTO'" class="pl-6">
            <textarea formControlName="respuestaTexto" rows="4" class="w-full p-3 border rounded focus:ring-2 focus:ring-blue-500 outline-none resize-y" placeholder="Escribe tu respuesta aquí..."></textarea>
          </div>

        </div>
      </div>

      <!-- Submit -->
      <div class="flex justify-between items-center pt-6 border-t">
        <p class="text-sm text-slate-500 italic">Asegúrate de revisar tus respuestas antes de enviar.</p>
        <div class="flex gap-3">
          <button type="button" *ngIf="!cuestionario?.limiteTiempoMinutos" (click)="cancel.emit()" class="px-6 py-2 border rounded text-slate-700 hover:bg-slate-50 font-semibold transition">
            Cancelar
          </button>
          <button type="submit" [disabled]="form.invalid" class="px-8 py-3 bg-blue-600 text-white rounded font-bold text-lg hover:bg-blue-700 transition shadow-md disabled:opacity-50">
            🚀 Enviar Examen
          </button>
        </div>
      </div>

    </form>
  </div>
</div>
